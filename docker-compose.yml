services:
  smartfinances:
    build: .
    container_name: smartfinances_bot
    restart: unless-stopped
    # Bypass host systemd-resolved (it has hung in the past and starved DNS
    # for the whole container, see incident 2026-05-24). Going straight to
    # public resolvers means a flaky host stub no longer takes the bot down.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Forward the whole .env file (TELEGRAM_BOT_TOKEN, OPENAI_API_KEY,
    # ADMIN_USER_IDS, SENTRY_DSN, YOOKASSA_*, etc.) into the container.
    env_file:
      - .env
    # Container-internal paths that override host .env values:
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/google_credentials.json
      - DATABASE_URL=sqlite:////app/data/smartfinances.db
    volumes:
      - ./data:/app/data
      - ./google_credentials.json:/app/google_credentials.json:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
